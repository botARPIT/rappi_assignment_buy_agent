[project]
name = "rappi-purchasing-agent"
version = "0.2.0"
description = "LangChain purchasing agent with gated policy and DeepEval evaluation"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.4.6,<2",
  "langchain-ollama>=1.1.0,<2",
  "langgraph>=1.2.18,<2",
  "deepeval>=4.3.1,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.12", "playwright>=1.50"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
